[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnxforge"
version = "0.1.0"
description = "Remote ONNX benchmarking system"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"