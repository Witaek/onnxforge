[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnxforge-agent"
version = "0.1.0"
description = "Remote ONNXForge agent service"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "onnxforge-shared",
]

[tool.setuptools.packages.find]
where = ["src"]